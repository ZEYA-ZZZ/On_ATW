<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ชมอร: Around the World</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Noto+Sans+Thai:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9A84C;
    --gold-light: #E8D5A3;
    --gold-dark: #8B6914;
    --deep: #0A0E1A;
    --deep2: #111827;
    --surface: #161D2E;
    --surface2: #1E2740;
    --text: #F0EAD6;
    --text-muted: #8A8FA8;
    --accent: #4A90D9;
    --visited: #2ECC71;
    --upcoming: #E8A838;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans Thai', sans-serif;
    background: var(--deep);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ============ HOME PAGE ============ */
  #home-page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    overflow: hidden;
  }
  .stars-bg {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 20% 50%, #0d1a3a 0%, #0A0E1A 60%);
    z-index: 0;
  }
  .stars-bg::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 25% 40%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 50% 10%, rgba(255,255,255,0.7) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 30%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 85% 20%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 15% 70%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 80%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 40% 85%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 60%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 75% 90%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 35% 55%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 5% 45%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 95% 55%, rgba(255,255,255,0.4) 0%, transparent 100%);
  }
  .home-header {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 3rem 2rem 1rem;
  }
  .home-header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.2rem, 5vw, 4rem);
    color: var(--gold);
    letter-spacing: 0.05em;
    line-height: 1.1;
  }
  .home-header h1 span {
    font-style: italic;
    color: var(--text);
    font-size: 0.6em;
    display: block;
    letter-spacing: 0.3em;
    font-weight: 400;
    margin-top: 0.3rem;
  }
  .home-header p {
    color: var(--text-muted);
    margin-top: 0.5rem;
    font-size: 0.9rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  /* Globe container */
  .globe-wrap {
    position: relative;
    z-index: 2;
    margin: 1.5rem auto;
    width: min(520px, 90vw);
    aspect-ratio: 1;
    cursor: grab;
  }
  .globe-wrap:active { cursor: grabbing; }
  #globe-canvas {
    width: 100%;
    height: 100%;
    border-radius: 50%;
  }

  /* Legend */
  .globe-legend {
    position: relative;
    z-index: 2;
    display: flex;
    gap: 2rem;
    justify-content: center;
    margin-bottom: 1.5rem;
    font-size: 0.85rem;
  }
  .legend-item { display: flex; align-items: center; gap: 0.5rem; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .dot-visited { background: var(--visited); box-shadow: 0 0 6px var(--visited); }
  .dot-upcoming { background: var(--upcoming); box-shadow: 0 0 6px var(--upcoming); }

  /* Trips list on homepage */
  .trips-section {
    position: relative;
    z-index: 2;
    width: min(860px, 92vw);
    margin: 0 auto 4rem;
  }
  .trips-section h2 {
    font-family: 'Playfair Display', serif;
    color: var(--gold);
    font-size: 1.5rem;
    margin-bottom: 1.2rem;
    border-bottom: 1px solid rgba(201,168,76,0.25);
    padding-bottom: 0.75rem;
  }
  .trips-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 1rem;
  }
  .trip-card {
    background: var(--surface);
    border: 1px solid rgba(201,168,76,0.15);
    border-radius: var(--radius);
    padding: 1.25rem;
    cursor: pointer;
    transition: border-color 0.2s, transform 0.2s;
    position: relative;
    overflow: hidden;
  }
  .trip-card:hover {
    border-color: var(--gold);
    transform: translateY(-2px);
  }
  .trip-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
  }
  .trip-card.visited::before { background: var(--visited); }
  .trip-card.upcoming::before { background: var(--upcoming); }
  .trip-card.draft::before { background: var(--text-muted); }
  .trip-status-badge {
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 20px;
    display: inline-block;
    margin-bottom: 0.5rem;
    font-weight: 500;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .badge-visited { background: rgba(46,204,113,0.15); color: var(--visited); }
  .badge-upcoming { background: rgba(232,168,56,0.15); color: var(--upcoming); }
  .badge-draft { background: rgba(138,143,168,0.15); color: var(--text-muted); }
  .trip-card h3 { font-size: 1rem; font-weight: 600; margin-bottom: 0.25rem; }
  .trip-card .trip-dates { font-size: 0.8rem; color: var(--text-muted); }

  .btn-new-trip {
    display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    background: transparent;
    border: 1px dashed rgba(201,168,76,0.4);
    border-radius: var(--radius);
    padding: 1.25rem;
    color: var(--gold);
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Noto Sans Thai', sans-serif;
  }
  .btn-new-trip:hover {
    background: rgba(201,168,76,0.08);
    border-color: var(--gold);
  }
  .btn-new-trip svg { width: 20px; height: 20px; }

  /* ============ TRIP PAGE ============ */
  #trip-page {
    display: none;
    min-height: 100vh;
    background: var(--deep2);
  }
  .trip-header {
    background: var(--surface);
    border-bottom: 1px solid rgba(201,168,76,0.2);
    padding: 1.2rem 2rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .btn-back {
    background: none;
    border: none;
    color: var(--gold);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.9rem;
    font-family: 'Noto Sans Thai', sans-serif;
    padding: 0.4rem 0.75rem;
    border-radius: 8px;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .btn-back:hover { background: rgba(201,168,76,0.1); }
  .trip-header-info { flex: 1; }
  .trip-header-info h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    color: var(--gold);
  }
  .trip-header-info p { font-size: 0.8rem; color: var(--text-muted); }
  .trip-header-actions { display: flex; gap: 0.5rem; }

  .btn-primary {
    background: var(--gold);
    color: var(--deep);
    border: none;
    border-radius: 8px;
    padding: 0.5rem 1.2rem;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.15s;
    font-family: 'Noto Sans Thai', sans-serif;
  }
  .btn-primary:hover { opacity: 0.88; }
  .btn-secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid rgba(240,234,214,0.25);
    border-radius: 8px;
    padding: 0.5rem 1.2rem;
    font-size: 0.85rem;
    cursor: pointer;
    transition: background 0.15s;
    font-family: 'Noto Sans Thai', sans-serif;
  }
  .btn-secondary:hover { background: var(--surface2); }

  /* Tabs (dates) */
  .tabs-wrap {
    background: var(--surface);
    padding: 0 2rem;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    gap: 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs-wrap::-webkit-scrollbar { display: none; }
  .tab-btn {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text-muted);
    padding: 0.9rem 1.2rem;
    cursor: pointer;
    font-size: 0.85rem;
    white-space: nowrap;
    transition: all 0.15s;
    font-family: 'Noto Sans Thai', sans-serif;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active {
    color: var(--gold);
    border-bottom-color: var(--gold);
  }
  .tab-add-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    padding: 0.9rem 0.75rem;
    cursor: pointer;
    font-size: 1.2rem;
    transition: color 0.15s;
    font-family: 'Noto Sans Thai', sans-serif;
  }
  .tab-add-btn:hover { color: var(--gold); }

  /* Day content */
  .day-content {
    padding: 2rem;
    max-width: 900px;
    margin: 0 auto;
  }

  /* View Mode */
  .activities-view { display: flex; flex-direction: column; gap: 1rem; }
  .activity-view-card {
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: var(--radius);
    overflow: hidden;
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 0;
  }
  .activity-time-col {
    padding: 1.2rem;
    text-align: center;
    min-width: 72px;
    border-right: 1px solid rgba(255,255,255,0.06);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.02);
  }
  .activity-time-col .time-big { font-size: 1.1rem; font-weight: 600; color: var(--gold); }
  .activity-time-col .time-am { font-size: 0.7rem; color: var(--text-muted); }
  .activity-info-col { padding: 1.2rem; }
  .activity-info-col h3 { font-size: 1rem; font-weight: 600; margin-bottom: 0.3rem; }
  .activity-info-col .activity-link a {
    color: var(--accent);
    font-size: 0.82rem;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 0.3rem;
  }
  .activity-info-col .activity-link a:hover { text-decoration: underline; }
  .activity-img-col {
    width: 120px;
    overflow: hidden;
  }
  .activity-img-col img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .activity-img-placeholder {
    width: 120px;
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .activity-img-placeholder svg { opacity: 0.25; }

  /* Album link section (view mode, visited) */
  .album-section {
    margin-top: 2rem;
    padding: 1.2rem;
    background: rgba(46,204,113,0.06);
    border: 1px solid rgba(46,204,113,0.2);
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .album-section span { font-size: 0.9rem; color: var(--text); flex: 1; min-width: 120px; }
  .album-section input[type=url] {
    flex: 2;
    min-width: 180px;
    background: var(--surface);
    border: 1px solid rgba(46,204,113,0.3);
    border-radius: 8px;
    padding: 0.5rem 0.8rem;
    color: var(--text);
    font-size: 0.85rem;
    font-family: 'Noto Sans Thai', sans-serif;
  }
  .album-section input:focus { outline: none; border-color: var(--visited); }
  .album-section a.album-link {
    color: var(--visited);
    font-size: 0.85rem;
    display: flex;
    align-items: center;
    gap: 0.3rem;
    text-decoration: none;
  }
  .album-section a.album-link:hover { text-decoration: underline; }
  .btn-save-album {
    background: rgba(46,204,113,0.15);
    border: 1px solid var(--visited);
    color: var(--visited);
    border-radius: 8px;
    padding: 0.45rem 1rem;
    cursor: pointer;
    font-size: 0.82rem;
    transition: background 0.15s;
    font-family: 'Noto Sans Thai', sans-serif;
  }
  .btn-save-album:hover { background: rgba(46,204,113,0.25); }

  /* Edit Mode */
  .edit-mode { display: flex; flex-direction: column; gap: 1.2rem; }
  .activity-edit-card {
    background: var(--surface);
    border: 1px solid rgba(201,168,76,0.2);
    border-radius: var(--radius);
    padding: 1.25rem;
    position: relative;
  }
  .edit-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
    margin-bottom: 0.75rem;
  }
  .edit-row.full { grid-template-columns: 1fr; }
  .field-group label {
    display: block;
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-bottom: 0.35rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .field-group input[type=text],
  .field-group input[type=time],
  .field-group input[type=url],
  .field-group input[type=date] {
    width: 100%;
    background: var(--deep2);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 0.55rem 0.85rem;
    color: var(--text);
    font-size: 0.9rem;
    font-family: 'Noto Sans Thai', sans-serif;
    transition: border-color 0.15s;
  }
  .field-group input:focus {
    outline: none;
    border-color: var(--gold);
  }
  .field-group input[type=time]::-webkit-calendar-picker-indicator,
  .field-group input[type=date]::-webkit-calendar-picker-indicator {
    filter: invert(0.7);
    cursor: pointer;
  }

  .img-upload-area {
    border: 1px dashed rgba(255,255,255,0.15);
    border-radius: 8px;
    padding: 1rem;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s;
    position: relative;
    min-height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 0.3rem;
  }
  .img-upload-area:hover { border-color: var(--gold); }
  .img-upload-area input[type=file] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }
  .img-upload-area p { font-size: 0.8rem; color: var(--text-muted); pointer-events: none; }
  .img-preview {
    width: 100%;
    max-height: 140px;
    object-fit: cover;
    border-radius: 6px;
    display: none;
  }

  .btn-remove-activity {
    position: absolute;
    top: 0.75rem;
    right: 0.75rem;
    background: rgba(226,74,74,0.12);
    border: 1px solid rgba(226,74,74,0.3);
    color: #e24a4a;
    border-radius: 6px;
    width: 28px;
    height: 28px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    transition: background 0.15s;
  }
  .btn-remove-activity:hover { background: rgba(226,74,74,0.25); }

  .btn-add-activity {
    background: transparent;
    border: 1px dashed rgba(201,168,76,0.35);
    border-radius: var(--radius);
    padding: 0.9rem;
    color: var(--gold);
    font-size: 0.9rem;
    cursor: pointer;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    transition: background 0.15s;
    font-family: 'Noto Sans Thai', sans-serif;
  }
  .btn-add-activity:hover { background: rgba(201,168,76,0.07); }

  /* New trip modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--surface);
    border: 1px solid rgba(201,168,76,0.3);
    border-radius: 16px;
    padding: 2rem;
    width: min(480px, 100%);
  }
  .modal-box h3 {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    color: var(--gold);
    margin-bottom: 1.5rem;
  }
  .modal-box .field-group { margin-bottom: 1rem; }
  .modal-actions { display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.5rem; }

  /* No trips empty */
  .empty-trips {
    text-align: center;
    padding: 3rem;
    color: var(--text-muted);
    grid-column: 1/-1;
  }
  .empty-trips svg { opacity: 0.2; margin-bottom: 1rem; }
  .empty-trips p { font-size: 0.9rem; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--surface2);
    border: 1px solid rgba(201,168,76,0.3);
    color: var(--text);
    padding: 0.75rem 1.5rem;
    border-radius: 100px;
    font-size: 0.88rem;
    z-index: 300;
    transition: transform 0.3s;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* Activity type badge */
  .activity-type-badge {
    display: inline-flex; align-items: center; gap: 0.3rem;
    font-size: 0.72rem; padding: 2px 9px; border-radius: 20px;
    font-weight: 500; margin-bottom: 0.4rem;
    background: rgba(201,168,76,0.12); color: var(--gold-light);
    border: 1px solid rgba(201,168,76,0.2);
  }
  /* Notes display */
  .activity-notes {
    margin-top: 0.4rem;
    font-size: 0.82rem;
    color: var(--text-muted);
    line-height: 1.5;
    white-space: pre-wrap;
  }
  /* Nav buttons row */
  .nav-buttons {
    display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.55rem;
  }
  .nav-btn {
    display: inline-flex; align-items: center; gap: 0.3rem;
    font-size: 0.78rem; padding: 4px 10px; border-radius: 20px;
    text-decoration: none; font-family: 'Noto Sans Thai', sans-serif;
    transition: opacity 0.15s; border: 1px solid transparent;
  }
  .nav-btn:hover { opacity: 0.8; }
  .nav-btn-gmaps { background: rgba(66,133,244,0.15); color: #7ab3f7; border-color: rgba(66,133,244,0.3); }
  .nav-btn-apple { background: rgba(255,255,255,0.07); color: #ddd; border-color: rgba(255,255,255,0.2); }
  .nav-btn-waze  { background: rgba(0,204,204,0.12); color: #5dd9d9; border-color: rgba(0,204,204,0.25); }
  /* Textarea for notes */
  .field-group textarea {
    width: 100%;
    background: var(--deep2);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 0.55rem 0.85rem;
    color: var(--text);
    font-size: 0.9rem;
    font-family: 'Noto Sans Thai', sans-serif;
    resize: vertical;
    min-height: 72px;
    transition: border-color 0.15s;
  }
  .field-group textarea:focus { outline: none; border-color: var(--gold); }
  /* Select for type */
  .field-group select {
    width: 100%;
    background: var(--deep2);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 0.55rem 0.85rem;
    color: var(--text);
    font-size: 0.9rem;
    font-family: 'Noto Sans Thai', sans-serif;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .field-group select:focus { outline: none; border-color: var(--gold); }
  .field-group select option { background: var(--surface2); }

  @media (max-width: 600px) {
    .activity-view-card { grid-template-columns: auto 1fr; }
    .activity-img-col { display: none; }
    .edit-row { grid-template-columns: 1fr; }
    .trip-header { padding: 1rem; gap: 0.5rem; }
    .trip-header-info h2 { font-size: 1.1rem; }
  }
</style>
</head>
<body>

<!-- Stars background -->
<div class="stars-bg"></div>

<!-- ============ HOME PAGE ============ -->
<div id="home-page">
  <div class="home-header">
    <h1>ชมอร<span>Around the World</span></h1>
    <p>แผนการเดินทางของฉัน</p>
  </div>

  <!-- Globe -->
  <div class="globe-wrap" id="globe-wrap">
    <canvas id="globe-canvas"></canvas>
  </div>

  <!-- Legend -->
  <div class="globe-legend">
    <div class="legend-item"><span class="dot dot-visited"></span> เที่ยวแล้ว</div>
    <div class="legend-item"><span class="dot dot-upcoming"></span> กำลังจะมาถึง</div>
  </div>

  <!-- Trips -->
  <div class="trips-section">
    <h2>✈ ทริปทั้งหมด</h2>
    <div class="trips-grid" id="trips-grid">
      <!-- Rendered by JS -->
    </div>

<!-- 3D Globe: Three.js + TopoJSON -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script>
// ===================== DATA =====================
function loadData() {
  try { return JSON.parse(localStorage.getItem('chamorn_trips') || '[]'); } catch { return []; }
}
function saveData(trips) {
  localStorage.setItem('chamorn_trips', JSON.stringify(trips));
}

let trips = loadData();
let currentTripId = null;
let editMode = false;
let currentDayIdx = 0;

// Country → [lat, lng] approx centers
const COUNTRY_COORDS = {
  'japan': [36.2, 138.2], 'thailand': [15.8, 100.9], 'france': [46.2, 2.2],
  'italy': [41.9, 12.5], 'uk': [51.5, -0.1], 'usa': [39.5, -98.4],
  'australia': [-25.3, 133.8], 'germany': [51.2, 10.5], 'spain': [40.4, -3.7],
  'china': [35.9, 104.2], 'korea': [36.5, 127.9], 'singapore': [1.3, 103.8],
  'vietnam': [16.1, 107.8], 'indonesia': [-0.8, 113.9], 'maldives': [3.2, 73.2],
  'switzerland': [46.8, 8.2], 'greece': [39.1, 21.8], 'turkey': [38.9, 35.2],
  'egypt': [26.8, 30.8], 'india': [20.6, 78.9], 'uae': [23.4, 53.8],
  'canada': [56.1, -106.3], 'mexico': [23.6, -102.6], 'brazil': [-14.2, -51.9],
  'new zealand': [-40.9, 174.9], 'portugal': [39.4, -8.2], 'netherlands': [52.1, 5.3],
  'taiwan': [23.7, 121.0], 'malaysia': [4.2, 108.0], 'cambodia': [12.6, 104.9],
  'myanmar': [19.2, 96.7], 'laos': [19.9, 102.5], 'philippines': [12.9, 121.8],
};
function getCoords(country) {
  if (!country) return null;
  const k = country.toLowerCase().trim();
  for (const [c, v] of Object.entries(COUNTRY_COORDS)) {
    if (k.includes(c)) return v;
  }
  return null;
}
function tripStatus(trip) {
  const now = new Date(); now.setHours(0,0,0,0);
  const end = new Date(trip.endDate); end.setHours(0,0,0,0);
  const start = new Date(trip.startDate); start.setHours(0,0,0,0);
  if (!trip.startDate) return 'draft';
  if (end < now) return 'visited';
  if (start <= now) return 'upcoming';
  return 'upcoming';
}

// ===================== GLOBE =====================
let globeScene, globeCamera, globeRenderer;
let isDragging = false, prevMouse = {x:0,y:0}, autoRotate = true;
let globeGroup;
let markers = [];
let globeReady = false;

function latLngToXYZ(lat, lng, r) {
  const phi = (90 - lat) * Math.PI / 180;
  const theta = (lng + 180) * Math.PI / 180;
  return new THREE.Vector3(
    -r * Math.sin(phi) * Math.cos(theta),
     r * Math.cos(phi),
     r * Math.sin(phi) * Math.sin(theta)
  );
}

function initGlobe() {
  const wrap = document.getElementById('globe-wrap');
  const W = wrap.clientWidth, H = wrap.clientHeight;

  globeScene = new THREE.Scene();
  globeCamera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
  globeCamera.position.z = 2.6;

  globeRenderer = new THREE.WebGLRenderer({canvas: document.getElementById('globe-canvas'), antialias: true, alpha: true});
  globeRenderer.setSize(W, H);
  globeRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  globeRenderer.setClearColor(0x000000, 0);

  globeGroup = new THREE.Group();
  globeScene.add(globeGroup);

  // Ocean sphere
  globeGroup.add(new THREE.Mesh(
    new THREE.SphereGeometry(1, 48, 48),
    new THREE.MeshPhongMaterial({ color:0x1a3a6e, emissive:0x071020, specular:0x2244aa, shininess:22 })
  ));

  // Atmosphere rim
  globeGroup.add(new THREE.Mesh(
    new THREE.SphereGeometry(1.04, 32, 32),
    new THREE.MeshBasicMaterial({ color:0x3366cc, transparent:true, opacity:0.06, side:THREE.BackSide })
  ));

  // Lights
  globeScene.add(new THREE.AmbientLight(0xffffff, 0.42));
  const sun = new THREE.DirectionalLight(0xffeedd, 1.3);
  sun.position.set(4, 2, 3);
  globeScene.add(sun);
  const fill = new THREE.DirectionalLight(0x2244aa, 0.15);
  fill.position.set(-3, -1, -2);
  globeScene.add(fill);

  // Drag events
  const canvas = document.getElementById('globe-canvas');
  canvas.addEventListener('mousedown', e => { isDragging=true; autoRotate=false; prevMouse={x:e.clientX,y:e.clientY}; });
  window.addEventListener('mousemove', e => {
    if (!isDragging) return;
    const dx = e.clientX - prevMouse.x, dy = e.clientY - prevMouse.y;
    globeGroup.rotation.y += dx * 0.005;
    globeGroup.rotation.x = Math.max(-1.2, Math.min(1.2, globeGroup.rotation.x + dy * 0.005));
    prevMouse = {x:e.clientX, y:e.clientY};
  });
  window.addEventListener('mouseup', () => { isDragging=false; });
  canvas.addEventListener('touchstart', e => { isDragging=true; autoRotate=false; const t=e.touches[0]; prevMouse={x:t.clientX,y:t.clientY}; }, {passive:true});
  window.addEventListener('touchmove', e => {
    if (!isDragging) return;
    const t=e.touches[0], dx=t.clientX-prevMouse.x, dy=t.clientY-prevMouse.y;
    globeGroup.rotation.y += dx*0.005;
    globeGroup.rotation.x = Math.max(-1.2, Math.min(1.2, globeGroup.rotation.x + dy*0.005));
    prevMouse={x:t.clientX,y:t.clientY};
  }, {passive:true});
  window.addEventListener('touchend', ()=>{ isDragging=false; });

  // Load GeoJSON world borders
  fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
    .then(r => r.json())
    .then(world => {
      const countries = topojson.feature(world, world.objects.countries);
      const borders = topojson.mesh(world, world.objects.countries, (a,b) => a !== b);
      const land = topojson.merge(world, world.objects.countries.geometries);

      // Land fill mesh via canvas texture
      drawLandTexture(countries, land);
      // Country borders as lines
      drawBorderLines(borders);

      globeReady = true;
      updateGlobeMarkers();
    })
    .catch(() => {
      // fallback: plain green land
      globeGroup.add(new THREE.Mesh(
        new THREE.SphereGeometry(1.001, 32, 32),
        new THREE.MeshBasicMaterial({ color:0x2d6a3f, wireframe:false })
      ));
      globeReady = true;
      updateGlobeMarkers();
    });

  globeGroup.rotation.x = 0.3;
  globeGroup.rotation.y = 1.4;
  animateGlobe();
  setTimeout(()=>{ autoRotate=true; }, 2000);
}

function geoToXYZ(coord, r) {
  const [lng, lat] = coord;
  return latLngToXYZ(lat, lng, r);
}

function drawLandTexture(countries, land) {
  // Draw land onto canvas texture (equirectangular)
  const W = 2048, H = 1024;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = 'rgba(0,0,0,0)';
  ctx.fillRect(0,0,W,H);

  function project(coord) {
    const [lng, lat] = coord;
    return [(lng + 180) / 360 * W, (90 - lat) / 180 * H];
  }

  function drawGeoRing(ring, fill, stroke) {
    ctx.beginPath();
    ring.forEach(([lng, lat], i) => {
      const [x, y] = project([lng, lat]);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 0.6; ctx.stroke(); }
  }

  function drawGeometry(geom, fill, stroke) {
    if (!geom) return;
    if (geom.type === 'Polygon') {
      geom.coordinates.forEach(ring => drawGeoRing(ring, fill, stroke));
    } else if (geom.type === 'MultiPolygon') {
      geom.coordinates.forEach(poly => poly.forEach(ring => drawGeoRing(ring, fill, stroke)));
    }
  }

  // Land fill
  drawGeometry(land, '#2d6840', null);
  // Per-country slightly varied green + white border
  countries.features.forEach((f, i) => {
    const shade = i % 3 === 0 ? '#2a6038' : i % 3 === 1 ? '#317042' : '#266035';
    drawGeometry(f.geometry, shade, 'rgba(255,255,255,0.65)');
  });

  const tex = new THREE.CanvasTexture(cv);
  globeGroup.add(new THREE.Mesh(
    new THREE.SphereGeometry(1.001, 64, 64),
    new THREE.MeshPhongMaterial({ map:tex, transparent:true, shininess:3, specular:0x111111 })
  ));
}

function drawBorderLines(borders) {
  // Draw country borders as 3D lines on globe surface
  function coordsToLine(coords) {
    const pts = [];
    coords.forEach(([lng, lat]) => pts.push(latLngToXYZ(lat, lng, 1.003)));
    if (pts.length < 2) return;
    const geo = new THREE.BufferGeometry().setFromPoints(pts);
    globeGroup.add(new THREE.Line(geo,
      new THREE.LineBasicMaterial({ color:0xffffff, transparent:true, opacity:0.55 })
    ));
  }

  const geom = borders;
  if (geom.type === 'LineString') {
    coordsToLine(geom.coordinates);
  } else if (geom.type === 'MultiLineString') {
    geom.coordinates.forEach(coordsToLine);
  }
}

function updateGlobeMarkers() {
  if (!globeReady) return;
  markers.forEach(m => globeGroup.remove(m));
  markers = [];
  trips.forEach(trip => {
    const coords = getCoords(trip.country);
    if (!coords) return;
    const status = tripStatus(trip);
    const color = status === 'visited' ? 0x2ecc71 : 0xe8a838;
    const [lat, lng] = coords;
    const pos = latLngToXYZ(lat, lng, 1.025);
    const dot = new THREE.Mesh(
      new THREE.SphereGeometry(0.022, 8, 8),
      new THREE.MeshBasicMaterial({ color, transparent:true, opacity:0.95 })
    );
    dot.position.copy(pos);
    globeGroup.add(dot);
    markers.push(dot);
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(0.028, 0.042, 12),
      new THREE.MeshBasicMaterial({ color, side:THREE.DoubleSide, transparent:true, opacity:0.5 })
    );
    ring.position.copy(pos);
    ring.lookAt(0, 0, 0);
    globeGroup.add(ring);
    markers.push(ring);
  });
}

let globeTime = 0;
function animateGlobe() {
  requestAnimationFrame(animateGlobe);
  if (autoRotate && !isDragging) globeGroup.rotation.y += 0.003;
  globeTime += 0.04;
  markers.forEach((m, i) => {
    if (i % 2 === 1) {
      const s = 1 + 0.15 * Math.sin(globeTime + i);
      m.scale.set(s, s, s);
      m.material.opacity = 0.3 + 0.2 * Math.sin(globeTime + i);
    }
  });
  globeRenderer.render(globeScene, globeCamera);
}


// ===================== HOME RENDER =====================
function renderHome() {
  const grid = document.getElementById('trips-grid');
  grid.innerHTML = '';

  if (trips.length === 0) {
    grid.innerHTML = `<div class="empty-trips">
      <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      <p>ยังไม่มีทริป กดปุ่ม + เพื่อสร้างทริปแรก</p>
    </div>`;
  } else {
    trips.forEach(trip => {
      const status = tripStatus(trip);
      const labels = {visited:'เที่ยวแล้ว', upcoming:'กำลังจะมาถึง', draft:'ร่าง'};
      const card = document.createElement('div');
      card.className = `trip-card ${status}`;
      card.innerHTML = `
        <span class="trip-status-badge badge-${status}">${labels[status]}</span>
        <h3>${escHtml(trip.name)}</h3>
        <div class="trip-dates">${formatDate(trip.startDate)} — ${formatDate(trip.endDate)}</div>
      `;
      card.addEventListener('click', () => openTrip(trip.id));
      grid.appendChild(card);
    });
  }

  const addBtn = document.createElement('button');
  addBtn.className = 'btn-new-trip';
  addBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> สร้างทริปใหม่`;
  addBtn.addEventListener('click', () => document.getElementById('new-trip-modal').classList.add('open'));
  grid.appendChild(addBtn);

  updateGlobeMarkers();
}

// ===================== TRIP PAGE =====================
function openTrip(id) {
  currentTripId = id;
  editMode = false;
  const trip = trips.find(t => t.id === id);
  if (!trip) return;

  document.getElementById('home-page').style.display = 'none';
  document.getElementById('trip-page').style.display = 'block';
  document.getElementById('trip-title').textContent = trip.name;
  document.getElementById('trip-date-range').textContent =
    `${formatDate(trip.startDate)} — ${formatDate(trip.endDate)} · ${trip.country || ''}`;

  currentDayIdx = 0;
  renderTripTabs(trip);
  renderHeaderActions(trip);
  renderDayContent(currentDayIdx);
}

function goHome() {
  document.getElementById('trip-page').style.display = 'none';
  document.getElementById('home-page').style.display = 'flex';
  renderHome();
}

function renderTripTabs(trip) {
  const wrap = document.getElementById('tabs-wrap');
  wrap.innerHTML = '';
  const days = trip.days || [];
  days.forEach((day, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (i === currentDayIdx ? ' active' : '');
    btn.textContent = day.label || `วันที่ ${i+1}`;
    btn.addEventListener('click', () => {
      currentDayIdx = i;
      document.querySelectorAll('.tab-btn').forEach((b,j) => b.classList.toggle('active', j===i));
      renderDayContent(currentDayIdx);
    });
    wrap.appendChild(btn);
  });
  if (editMode) {
    const addDayBtn = document.createElement('button');
    addDayBtn.className = 'tab-add-btn';
    addDayBtn.title = 'เพิ่มวัน';
    addDayBtn.textContent = '+';
    addDayBtn.addEventListener('click', () => {
      const t = trips.find(t => t.id === currentTripId);
      addDay(t);
    });
    wrap.appendChild(addDayBtn);
  }
}

function addDay(trip) {
  if (!trip.days) trip.days = [];
  const nextDate = trip.days.length > 0
    ? addDays(trip.days[trip.days.length-1].date, 1)
    : trip.startDate;
  trip.days.push({ date: nextDate, label: `วันที่ ${trip.days.length+1}`, activities: [], albumUrl: '' });
  currentDayIdx = trip.days.length - 1;
  saveData(trips);
  renderTripTabs(trip);
  renderDayContent(currentDayIdx);
}

function addDays(dateStr, n) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  d.setDate(d.getDate() + n);
  return d.toISOString().split('T')[0];
}

function renderHeaderActions(trip) {
  const el = document.getElementById('header-actions');
  el.innerHTML = '';
  if (editMode) {
    const saveBtn = document.createElement('button');
    saveBtn.className = 'btn-primary';
    saveBtn.textContent = '💾 บันทึก';
    saveBtn.addEventListener('click', () => {
      saveData(trips);
      editMode = false;
      const t = trips.find(t => t.id === currentTripId);
      renderHeaderActions(t);
      renderTripTabs(t);
      renderDayContent(currentDayIdx);
      showToast('บันทึกแพลนเรียบร้อย ✅');
    });
    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'btn-secondary';
    cancelBtn.textContent = 'ยกเลิก';
    cancelBtn.addEventListener('click', () => {
      // reload from localStorage to discard changes
      trips = loadData();
      editMode = false;
      const t = trips.find(t => t.id === currentTripId);
      renderHeaderActions(t);
      renderTripTabs(t);
      renderDayContent(currentDayIdx);
    });
    el.appendChild(cancelBtn);
    el.appendChild(saveBtn);
  } else {
    const editBtn = document.createElement('button');
    editBtn.className = 'btn-secondary';
    editBtn.innerHTML = '✏️ แก้ไข';
    editBtn.addEventListener('click', () => {
      editMode = true;
      const t = trips.find(t => t.id === currentTripId);
      renderHeaderActions(t);
      renderTripTabs(t);
      renderDayContent(currentDayIdx);
    });
    el.appendChild(editBtn);

    const delBtn = document.createElement('button');
    delBtn.style.cssText = 'background:transparent;border:1px solid rgba(226,74,74,0.4);color:#e24a4a;border-radius:8px;padding:.5rem 1rem;font-size:.82rem;cursor:pointer;font-family:"Noto Sans Thai",sans-serif;';
    delBtn.textContent = '🗑 ลบ';
    delBtn.addEventListener('click', () => {
      if (confirm(`ลบทริป "${trip.name}" ใช่ไหม?`)) {
        trips = trips.filter(t => t.id !== trip.id);
        saveData(trips);
        goHome();
      }
    });
    el.appendChild(delBtn);
  }
}

// ---- renderDayContent: always reads from trips array directly ----
function renderDayContent(dayIdx) {
  const trip = trips.find(t => t.id === currentTripId);
  if (!trip) return;
  currentDayIdx = dayIdx;

  const cont = document.getElementById('day-content');
  cont.innerHTML = '';

  if (!trip.days || trip.days.length === 0) {
    const msg = document.createElement('div');
    msg.style.cssText = 'text-align:center;padding:3rem;color:var(--text-muted);';
    msg.textContent = editMode ? 'ยังไม่มีวัน — กด "+" ที่แถบด้านบนเพื่อเพิ่มวัน' : 'ยังไม่มีข้อมูล กด ✏️ แก้ไข เพื่อเริ่มวางแผน';
    cont.appendChild(msg);
    return;
  }

  const day = trip.days[dayIdx];
  if (!day) return;

  if (editMode) renderEditMode(cont, trip, day, dayIdx);
  else renderViewMode(cont, trip, day, dayIdx);
}

// ---- VIEW MODE ----
function buildNavButtons(act) {
  const frag = document.createElement('div');
  frag.className = 'nav-buttons';
  const encName = encodeURIComponent(act.place || '');
  const customLink = (act.navLink || '').trim();

  const gBtn = document.createElement('a');

  gBtn.className = 'nav-btn nav-btn-gmaps';
  gBtn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg> Google Maps`;
  frag.appendChild(gBtn);

  const apBtn = document.createElement('a');
  apBtn.href = `https://maps.apple.com/?q=${encName}`; apBtn.target = '_blank'; apBtn.rel = 'noopener';
  apBtn.className = 'nav-btn nav-btn-apple';
  apBtn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg> Apple Maps`;
  frag.appendChild(apBtn);

  const wBtn = document.createElement('a');
  wBtn.href = `https://waze.com/ul?q=${encName}&navigate=yes`; wBtn.target = '_blank'; wBtn.rel = 'noopener';
  wBtn.className = 'nav-btn nav-btn-waze';
  wBtn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg> Waze`;
  frag.appendChild(wBtn);

  return frag;
}

function renderViewMode(cont, trip, day, dayIdx) {
  const wrap = document.createElement('div');
  wrap.className = 'activities-view';

  if (!day.activities || day.activities.length === 0) {
    const empty = document.createElement('div');
    empty.style.cssText = 'text-align:center;padding:3rem;color:var(--text-muted);';
    empty.textContent = 'ยังไม่มีกิจกรรมในวันนี้';
    wrap.appendChild(empty);
  } else {
    day.activities.forEach(act => {
      const card = document.createElement('div');
      card.className = 'activity-view-card';

      // Time column
      const timeCol = document.createElement('div');
      timeCol.className = 'activity-time-col';
      const [h, m] = (act.time || '00:00').split(':');
      const hNum = parseInt(h);
      const h12 = hNum % 12 || 12;
      const ampm = hNum >= 12 ? 'PM' : 'AM';
      timeCol.innerHTML = `<span class="time-big">${h12}:${m}</span><span class="time-am">${ampm}</span>`;
      card.appendChild(timeCol);

      // Info column
      const infoCol = document.createElement('div');
      infoCol.className = 'activity-info-col';
      const dateStr = act.date ? `<span style="font-size:0.75rem;color:var(--text-muted);display:block;margin-bottom:0.3rem;">📅 ${formatDate(act.date)}</span>` : '';
      infoCol.innerHTML = `${dateStr}<h3>${escHtml(act.place || '(ไม่มีชื่อ)')}</h3>`;
      infoCol.appendChild(buildNavButtons(act));
      card.appendChild(infoCol);

      // No image col needed
      wrap.appendChild(card);
    });
  }
  cont.appendChild(wrap);
}

// ---- EDIT MODE ----
function renderEditMode(cont, trip, day, dayIdx) {
  // Ensure activities array exists
  if (!day.activities) day.activities = [];
  // Auto-add one blank card if empty
  if (day.activities.length === 0) {
    day.activities.push({ date: day.date || '', time: '09:00', place: '', navLink: '' });
  }

  const wrap = document.createElement('div');
  wrap.className = 'edit-mode';

  day.activities.forEach((act, ai) => {
    wrap.appendChild(buildActivityEditCard(act, ai, day, dayIdx));
  });

  const addActBtn = document.createElement('button');
  addActBtn.className = 'btn-add-activity';
  addActBtn.innerHTML = `<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> เพิ่มสถานที่`;
  addActBtn.addEventListener('click', () => {
    day.activities.push({ date: day.date || '', time: '09:00', place: '', navLink: '' });
    renderDayContent(dayIdx);
  });
  wrap.appendChild(addActBtn);
  cont.appendChild(wrap);
}

function buildActivityEditCard(act, ai, day, dayIdx) {
  const card = document.createElement('div');
  card.className = 'activity-edit-card';

  // Header
  const header = document.createElement('div');
  header.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;';
  const label = document.createElement('span');
  label.style.cssText = 'font-size:0.8rem;color:var(--gold);font-weight:600;';
  label.textContent = `📍 สถานที่ ${ai + 1}`;
  const removeBtn = document.createElement('button');
  removeBtn.className = 'btn-remove-activity';
  removeBtn.title = 'ลบ';
  removeBtn.textContent = '✕';
  removeBtn.addEventListener('click', () => {
    day.activities.splice(ai, 1);
    renderDayContent(dayIdx);
  });
  header.appendChild(label);
  header.appendChild(removeBtn);
  card.appendChild(header);

  // Row 1: วันที่ + เวลา
  const row1 = document.createElement('div');
  row1.className = 'edit-row';

  const dateGroup = document.createElement('div');
  dateGroup.className = 'field-group';
  const dateLabel = document.createElement('label');
  dateLabel.textContent = 'วันที่';
  const dateInput = document.createElement('input');
  dateInput.type = 'date';
  dateInput.value = act.date || day.date || '';
  dateInput.addEventListener('change', e => { act.date = e.target.value; });
  dateGroup.appendChild(dateLabel);
  dateGroup.appendChild(dateInput);

  const timeGroup = document.createElement('div');
  timeGroup.className = 'field-group';
  const timeLabel = document.createElement('label');
  timeLabel.textContent = 'เวลา';
  const timeInput = document.createElement('input');
  timeInput.type = 'time';
  timeInput.value = act.time || '09:00';
  timeInput.addEventListener('change', e => { act.time = e.target.value; });
  timeGroup.appendChild(timeLabel);
  timeGroup.appendChild(timeInput);

  row1.appendChild(dateGroup);
  row1.appendChild(timeGroup);
  card.appendChild(row1);

  // Row 2: ชื่อสถานที่
  const row2 = document.createElement('div');
  row2.className = 'edit-row full';
  const placeGroup = document.createElement('div');
  placeGroup.className = 'field-group';
  const placeLabel = document.createElement('label');
  placeLabel.textContent = 'ชื่อสถานที่';
  const placeInput = document.createElement('input');
  placeInput.type = 'text';
  placeInput.value = act.place || '';
  placeInput.placeholder = 'เช่น Shinjuku Gyoen, Tokyo Tower...';
  placeInput.addEventListener('input', e => { act.place = e.target.value; });
  placeGroup.appendChild(placeLabel);
  placeGroup.appendChild(placeInput);
  row2.appendChild(placeGroup);
  card.appendChild(row2);

  // Row 3: ลิงค์นำทาง
  const row3 = document.createElement('div');
  row3.className = 'edit-row full';
  const navGroup = document.createElement('div');
  navGroup.className = 'field-group';
  const navLabel = document.createElement('label');
  navLabel.textContent = 'ลิงค์นำทาง (ไม่บังคับ)';
  const navInput = document.createElement('input');
  navInput.type = 'url';
  navInput.value = act.navLink || '';
  navInput.placeholder = 'https://maps.google.com/...';
  navInput.addEventListener('input', e => { act.navLink = e.target.value; });
  navGroup.appendChild(navLabel);
  navGroup.appendChild(navInput);
  row3.appendChild(navGroup);
  card.appendChild(row3);

  return card;
}

// ===================== NEW TRIP MODAL =====================
function createTrip() {
  const name = document.getElementById('new-trip-name').value.trim();
  const start = document.getElementById('new-trip-start').value;
  const end = document.getElementById('new-trip-end').value;
  const country = document.getElementById('new-trip-country').value.trim();
  if (!name) { alert('กรุณาใส่ชื่อทริป'); return; }

  const days = [];
  if (start && end) {
    let cur = new Date(start);
    const endD = new Date(end);
    let n = 1;
    while (cur <= endD) {
      days.push({ date: cur.toISOString().split('T')[0], label: `วันที่ ${n}`, activities: [], albumUrl: '' });
      cur.setDate(cur.getDate() + 1);
      n++;
    }
  } else {
    days.push({ date: start || '', label: 'วันที่ 1', activities: [], albumUrl: '' });
  }

  const trip = {
    id: 'trip_' + Date.now(),
    name, startDate: start, endDate: end, country,
    days,
    createdAt: new Date().toISOString(),
  };
  trips.push(trip);
  saveData(trips);
  closeModal();
  renderHome();
  openTrip(trip.id);
}

function closeModal() {
  document.getElementById('new-trip-modal').classList.remove('open');
  ['new-trip-name','new-trip-start','new-trip-end','new-trip-country'].forEach(id => {
    document.getElementById(id).value = '';
  });
}
document.getElementById('new-trip-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('new-trip-modal')) closeModal();
});

// ===================== UTILS =====================
function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function formatDate(d) {
  if (!d) return '—';
  try { return new Date(d).toLocaleDateString('th-TH', {day:'numeric',month:'short',year:'numeric'}); }
  catch { return d; }
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ===================== INIT =====================
window.addEventListener('load', () => {
  renderHome();
  if (typeof THREE !== 'undefined') {
    initGlobe();
  } else {
    document.getElementById('globe-wrap').innerHTML = '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:.85rem;">ไม่สามารถโหลดลูกโลก 3D ได้</div>';
  }
});
